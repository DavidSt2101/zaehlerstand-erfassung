<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zählerstände erfassen</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      padding: 1em;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 1em;
    }
    form {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 2em;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin: 1.2em 0 0.4em;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 0.8em;
      font-size: 1.1em;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    select, button {
      width: 100%;
      padding: 1em;
      font-size: 1.1em;
      margin-top: 1.5em;
      border-radius: 6px;
      border: none;
      background: #007bff;
      color: white;
      font-weight: bold;
    }
    button:hover {
      background: #0056b3;
    }
    section {
      margin-top: 2em;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      display: none;
    }
    .checkmark {
      font-size: 5rem;
      color: #28a745;
      background: white;
      padding: 2rem;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h1>Zählerstand-Eingabe</h1>
  <form id="multiForm">
    <label for="gebaeude">Gebäude auswählen:</label>
    <select id="gebaeude" name="gebaeude">
      <option value="">Bitte wählen</option>
      <option value="kita-stadtzentrum">Kita Stadtzentrum</option>
      <option value="bauhof">Bauhof</option>
      <option value="rathaus">Rathaus</option>
    </select>

    <section id="kita-stadtzentrum" style="display:none;">
      <h2>Kita Stadtzentrum</h2>
      <label for="kita-stadtzentrum-strom">Kita Stadtzentrum Strom</label>
      <input type="text" id="kita-stadtzentrum-strom" inputmode="decimal" />
      <label for="kita-stadtzentrum-wasser">Kita Stadtzentrum Wasser</label>
      <input type="text" id="kita-stadtzentrum-wasser" inputmode="decimal" />
      <label for="kita-stadtzentrum-waerme">Kita Stadtzentrum Wärme</label>
      <input type="text" id="kita-stadtzentrum-waerme" inputmode="decimal" />
    </section>

    <section id="bauhof" style="display:none;">
      <h2>Bauhof</h2>
      <label for="bauhof-strom">Bauhof Strom</label>
      <input type="text" id="bauhof-strom" inputmode="decimal" />
      <label for="bauhof-wasser">Bauhof Wasser</label>
      <input type="text" id="bauhof-wasser" inputmode="decimal" />
      <label for="bauhof-waerme">Bauhof Wärme</label>
      <input type="text" id="bauhof-waerme" inputmode="decimal" />
    </section>

    <section id="rathaus" style="display:none;">
      <h2>Rathaus</h2>
      <label for="rathaus-strom">Rathaus Strom</label>
      <input type="text" id="rathaus-strom" inputmode="decimal" />
      <label for="rathaus-wasser">Rathaus Wasser</label>
      <input type="text" id="rathaus-wasser" inputmode="decimal" />
      <label for="rathaus-gas">Rathaus Gas</label>
      <input type="text" id="rathaus-gas" inputmode="decimal" />
    </section>

    <button type="submit">Alle absenden</button>
  </form>

  <div class="overlay" id="overlay">
    <div class="checkmark">✅</div>
  </div>

  <script>
    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    const gebaeudeSelect = document.getElementById("gebaeude");
    const sections = document.querySelectorAll("section");

    function showBuilding(buildingId) {
      gebaeudeSelect.value = buildingId;
      sections.forEach(sec => sec.style.display = "none");
      const selected = buildingId;
      if (selected) {
        document.getElementById(selected).style.display = "block";
      }
    }

    const autoGebaeude = getParam("gebaeude");
    if (autoGebaeude) {
      window.addEventListener("DOMContentLoaded", () => {
        showBuilding(autoGebaeude);
      });
    }

    gebaeudeSelect.addEventListener("change", () => {
      showBuilding(gebaeudeSelect.value);
    });

    function parseGerman(value) {
      if (!value) return null;
      let clean = value.replace(/\./g, "").replace(",", ".");
      let num = parseFloat(clean);
      return isNaN(num) ? null : num;
    }

    document.getElementById("multiForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const gebaeude = gebaeudeSelect.value;
      if (!gebaeude) return;

      const inputs = document.querySelectorAll(`#${gebaeude} input`);
      for (const input of inputs) {
        const value = parseGerman(input.value);
        if (value !== null) {
          await fetch("https://script.google.com/macros/s/AKfycbxt49pAvJVTj7h90AVAWuTUMSucnPva3wuIjz7jhA119kQk7p2LTaEOn45hjDcwJluLSA/exec", {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              zaehler_id: input.id,
              zaehlerstand: value
            })
          });
        }
        input.value = "";
      }

      const overlay = document.getElementById("overlay");
      overlay.style.display = "flex";
      overlay.addEventListener("click", () => {
        overlay.style.display = "none";
      });
    });
  </script>
</body>
</html>
