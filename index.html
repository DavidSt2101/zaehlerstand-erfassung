
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zählerstände erfassen</title>
  <style>
    :root {
      --gradient-bg: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      --primary: #007aff;
      --primary-dark: #0051a8;
      --input-bg: #f1f2f6;
      --input-border: #d1d1d6;
      --text-color: #1c1c1e;
      --radius: 12px;
    }

    html {
      font-size: 16px;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--gradient-bg);
      color: var(--text-color);
      padding: 1.5rem;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 2rem;
      font-weight: 600;
    }

    form {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin: 1.2em 0 0.4em;
      font-weight: 600;
      font-size: 1.1rem;
    }

    select, input {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
      box-sizing: border-box;
      margin-bottom: 1.5rem;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      outline: none;
    }

    button {
      width: 100%;
      padding: 1rem;
      font-size: 1.2rem;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      border-radius: var(--radius);
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,122,255,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,122,255,0.4);
    }

    h2 {
      font-size: 1.4rem;
      margin-top: 2rem;
    }

    section {
      margin-top: 1.5rem;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      display: none;
    }

    .checkmark {
      font-size: 5rem;
      color: #28a745;
      background: white;
      padding: 2rem;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    @media (max-width: 480px) {
      html {
        font-size: 15px;
      }

      h1 {
        font-size: 1.6rem;
      }

      h2 {
        font-size: 1.2rem;
      }

      label, input, select, button {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <h1>Zählerstand-Eingabe</h1>
  <form id="multiForm">
    <label for="gebaeude">Gebäude auswählen:</label>
    <select id="gebaeude" name="gebaeude">
      <option value="">Bitte wählen</option>
      <option value="kita-stadtzentrum">Kita Stadtzentrum</option>
      <option value="bauhof">Bauhof</option>
      <option value="rathaus">Rathaus</option>
    </select>

    <section id="kita-stadtzentrum" style="display:none;">
      <h2>Kita Stadtzentrum</h2>
      <label for="kita-stadtzentrum-strom">Strom</label>
      <input type="text" id="kita-stadtzentrum-strom" inputmode="decimal" />
      <label for="kita-stadtzentrum-wasser">Wasser</label>
      <input type="text" id="kita-stadtzentrum-wasser" inputmode="decimal" />
      <label for="kita-stadtzentrum-waerme">Wärme</label>
      <input type="text" id="kita-stadtzentrum-waerme" inputmode="decimal" />
    </section>

    <section id="bauhof" style="display:none;">
      <h2>Bauhof</h2>
      <label for="bauhof-strom">Strom</label>
      <input type="text" id="bauhof-strom" inputmode="decimal" />
      <label for="bauhof-wasser">Wasser</label>
      <input type="text" id="bauhof-wasser" inputmode="decimal" />
      <label for="bauhof-waerme">Wärme</label>
      <input type="text" id="bauhof-waerme" inputmode="decimal" />
    </section>

    <section id="rathaus" style="display:none;">
      <h2>Rathaus</h2>
      <label for="rathaus-strom">Strom</label>
      <input type="text" id="rathaus-strom" inputmode="decimal" />
      <label for="rathaus-wasser">Wasser</label>
      <input type="text" id="rathaus-wasser" inputmode="decimal" />
      <label for="rathaus-gas">Gas</label>
      <input type="text" id="rathaus-gas" inputmode="decimal" />
    </section>

    <button type="submit">Alle absenden</button>
  </form>

  <div class="overlay" id="overlay">
    <div class="checkmark">✅</div>
  </div>

  <script>
    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    const gebaeudeSelect = document.getElementById("gebaeude");
    const sections = document.querySelectorAll("section");

    function showBuilding(buildingId) {
      gebaeudeSelect.value = buildingId;
      sections.forEach(sec => sec.style.display = "none");
      if (buildingId) {
        document.getElementById(buildingId).style.display = "block";
      }
    }

    const autoGebaeude = getParam("gebaeude");
    if (autoGebaeude) {
      window.addEventListener("DOMContentLoaded", () => {
        showBuilding(autoGebaeude);
      });
    }

    gebaeudeSelect.addEventListener("change", () => {
      showBuilding(gebaeudeSelect.value);
    });

    function parseGerman(value) {
      if (!value) return null;
      let clean = value.replace(/\./g, "").replace(",", ".");
      let num = parseFloat(clean);
      return isNaN(num) ? null : num;
    }

    document.getElementById("multiForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const gebaeude = gebaeudeSelect.value;
      if (!gebaeude) return;

      const inputs = document.querySelectorAll(`#${gebaeude} input`);
      for (const input of inputs) {
        const value = parseGerman(input.value);
        if (value !== null) {
          await fetch("https://script.google.com/macros/s/AKfycbxt49pAvJVTj7h90AVAWuTUMSucnPva3wuIjz7jhA119kQk7p2LTaEOn45hjDcwJluLSA/exec", {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              zaehler_id: input.id,
              zaehlerstand: value
            })
          });
        }
        input.value = "";
      }

      const overlay = document.getElementById("overlay");
      overlay.style.display = "flex";
      overlay.addEventListener("click", () => {
        overlay.style.display = "none";
      });
    });
  </script>
</body>
</html>
