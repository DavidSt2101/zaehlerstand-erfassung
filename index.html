<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zählerstand eingeben</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2em;
      background: #f4f4f4;
    }
    form {
      background: white;
      padding: 2em;
      border-radius: 8px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label, input, button {
      display: block;
      width: 100%;
      margin-bottom: 1em;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 0.75em;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      display: none;
    }
    .checkmark {
      font-size: 5rem;
      color: #28a745;
      background: white;
      padding: 2rem;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <form id="zaehlerForm">
    <h2>Zählerstand erfassen</h2>

    <label for="zaehler_id">Zähler:</label>
    <select id="zaehler_id" name="zaehler_id" required>
      <option value="strom-rathaus">Rathaus Strom</option>
      <option value="wasser-rathaus">Rathaus Wasser</option>
      <option value="gas-rathaus">Rathaus Gas</option>
    </select>

    <label for="zaehlerstand">Zählerstand:</label>
    <input type="number" step="0.01" id="zaehlerstand" name="zaehlerstand" required inputmode="decimal" />

    <button type="submit">Absenden</button>
  </form>

  <div class="overlay" id="overlay">
    <div class="checkmark" id="checkmark">✅</div>
  </div>

  <script>
    document.getElementById('zaehlerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const zaehlerId = document.getElementById('zaehler_id').value;
      const stand = document.getElementById('zaehlerstand').value;

      const labelMap = {
        "strom-rathaus": "Rathaus Strom",
        "wasser-rathaus": "Rathaus Wasser",
        "gas-rathaus": "Rathaus Gas"
      };

      const confirmText = `Du hast den Zählerstand "${stand}" für "${labelMap[zaehlerId]}" eingegeben. Ist das korrekt?`;
      if (!confirm(confirmText)) return;

      await fetch('https://script.google.com/macros/s/AKfycbxt49pAvJVTj7h90AVAWuTUMSucnPva3wuIjz7jhA119kQk7p2LTaEOn45hjDcwJluLSA/exec', {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          zaehler_id: zaehlerId,
          zaehlerstand: stand
        })
      });

      // Zeige grünen Haken
      const overlay = document.getElementById('overlay');
      overlay.style.display = 'flex';

      overlay.addEventListener('click', () => {
        overlay.style.display = 'none';
      });

      document.getElementById('zaehlerstand').value = '';
    });
  </script>
</body>
</html>
