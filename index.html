<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zählerstand eingeben</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1em;
      margin: 0;
      background: #f4f4f4;
    }
    form {
      background: white;
      padding: 1.5em;
      border-radius: 10px;
      max-width: 100%;
      width: 100%;
      box-sizing: border-box;
      margin: 1em auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    h2 {
      font-size: 1.5em;
      text-align: center;
    }
    label {
      font-size: 1em;
      margin-bottom: 0.5em;
    }
    input, select, button {
      display: block;
      width: 100%;
      font-size: 1.2em;
      padding: 0.75em;
      margin-bottom: 1.2em;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      font-weight: bold;
    }
    button:hover {
      background: #0056b3;
    }
    @media (min-width: 480px) {
      form {
        max-width: 400px;
      }
    }
  </style>
</head>
<body>
  <form id="zaehlerForm">
    <h2>Zählerstand erfassen</h2>

    <label for="zaehler_id">Zähler wählen:</label>
    <select id="zaehler_id" name="zaehler_id" required>
      <option value="">Bitte wählen</option>
      <option value="strom-rathaus">Rathaus Strom</option>
      <option value="wasser-rathaus">Rathaus Wasser</option>
      <option value="gas-rathaus">Rathaus Gas</option>
    </select>

    <label for="zaehlerstand">Zählerstand:</label>
    <input type="text" inputmode="decimal" pattern="[0-9]+([\.,][0-9]{1,2})?" id="zaehlerstand" name="zaehlerstand" required />

    <button type="submit">Absenden</button>
  </form>

  <script>
    const zaehlerNamen = {
      'strom-rathaus': 'Rathaus Strom',
      'wasser-rathaus': 'Rathaus Wasser',
      'gas-rathaus': 'Rathaus Gas'
    };

    document.getElementById('zaehlerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const zaehlerId = document.getElementById('zaehler_id').value;
      const stand = document.getElementById('zaehlerstand').value;

      if (!zaehlerId) {
        alert('Bitte einen Zähler auswählen.');
        return;
      }

      const anzeigeName = zaehlerNamen[zaehlerId] || zaehlerId;
      const bestaetigt = confirm(`Du hast den Zählerstand "${stand}" für "${anzeigeName}" eingegeben. Ist das korrekt?`);
      if (!bestaetigt) {
        return;
      }

      await fetch('https://script.google.com/macros/s/AKfycbxt49pAvJVTj7h90AVAWuTUMSucnPva3wuIjz7jhA119kQk7p2LTaEOn45hjDcwJluLSA/exec', {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          zaehler_id: zaehlerId,
          zaehlerstand: stand.replace(',', '.')
        })
      });

      alert('Zählerstand erfolgreich übermittelt.');
      document.getElementById('zaehlerstand').value = '';
      document.getElementById('zaehler_id').value = '';
    });
  </script>
</body>
</html>
