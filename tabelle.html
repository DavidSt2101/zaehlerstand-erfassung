<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zählerstand-Tabelle</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 1em;
      background: #f4f4f4;
    }
    h2 {
      text-align: center;
      margin-bottom: 1em;
    }
    #filter {
      margin: 1em auto;
      max-width: 400px;
      display: block;
      padding: 0.6em;
      font-size: 1em;
    }
    #table_div, #chart_div {
      max-width: 1000px;
      margin: auto;
    }
    #chart_div {
      margin-top: 2em;
    }
  </style>
</head>
<body>
  <h2>Zählerstand-Übersicht</h2>
  <select id="filter">
    <option value="">Alle Zähler</option>
    <option value="strom-rathaus">Rathaus Strom</option>
    <option value="wasser-rathaus">Rathaus Wasser</option>
    <option value="gas-rathaus">Rathaus Gas</option>
  </select>

  <div id="table_div"></div>
  <div id="chart_div"></div>

  <script>
    const sheetId = "1FQRGGgJsAroNv29bPdziKyd6MXmb3n-pKg0ICCh5hP4";
    const sheetName = "Tabellenblatt1";
    const queryUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${sheetName}`;

    const zaehlernamen = {
      'strom-rathaus': 'Rathaus Strom',
      'wasser-rathaus': 'Rathaus Wasser',
      'gas-rathaus': 'Rathaus Gas'
    };

    google.charts.load('current', { packages: ['table', 'corechart'] });
    google.charts.setOnLoadCallback(draw);

    document.getElementById('filter').addEventListener('change', draw);

    function draw() {
      fetch(queryUrl)
        .then(res => res.text())
        .then(rep => {
          const data = JSON.parse(rep.substr(47).slice(0, -2));
          const rows = data.table.rows.map(r => {
            let zeit = "-";
            let dateObj = null;
            if (r.c[0] && r.c[0].v) {
              dateObj = new Date(r.c[0].v);
              if (!isNaN(dateObj)) {
                zeit = dateObj.toLocaleDateString();
              }
            }
            const zaehler = r.c[1]?.v || "-";
            const stand = r.c[2]?.v || null;
            return [zeit, zaehlernamen[zaehler] || zaehler, stand, dateObj];
          });

          const filterValue = document.getElementById('filter').value;
          const filteredRows = filterValue
            ? rows.filter(r => r[1] === zaehlernamen[filterValue])
            : rows;

          // Tabelle zeichnen
          const dataTable = new google.visualization.DataTable();
          dataTable.addColumn('string', 'Datum');
          dataTable.addColumn('string', 'Zähler');
          dataTable.addColumn('number', 'Zählerstand');
          dataTable.addRows(filteredRows.map(r => [r[0], r[1], r[2]]));

          const table = new google.visualization.Table(document.getElementById('table_div'));
          table.draw(dataTable, { showRowNumber: true, width: '100%', height: 'auto' });

          // Diagramm zeichnen
          if (filterValue) {
            const chartData = new google.visualization.DataTable();
            chartData.addColumn('date', 'Datum');
            chartData.addColumn('number', 'Zählerstand');
            chartData.addRows(
              filteredRows
                .filter(r => r[3] instanceof Date && !isNaN(r[3]) && typeof r[2] === 'number')
                .map(r => [r[3], r[2]])
            );

            const chart = new google.visualization.LineChart(document.getElementById('chart_div'));
            chart.draw(chartData, {
              title: `Zählerverlauf: ${zaehlernamen[filterValue]}`,
              height: 400,
              hAxis: { title: 'Datum', format: 'dd.MM.yyyy' },
              vAxis: { title: 'Zählerstand' },
              legend: 'none'
            });
          } else {
            document.getElementById('chart_div').innerHTML = '';
          }
        });
    }
  </script>
</body>
</html>
