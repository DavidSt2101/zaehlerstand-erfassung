<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zählerstand-Tabelle</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 1em;
      background: #f9f9f9;
      color: #222;
    }
    h2 {
      text-align: center;
      margin-bottom: 1em;
    }
    #filter {
      margin: 1em auto;
      max-width: 400px;
      display: block;
      padding: 0.6em;
      font-size: 1em;
    }
    #table_div {
      max-width: 1000px;
      margin: auto;
    }
  </style>
</head>
<body>
  <h2>Zählerstand-Übersicht</h2>
  <select id="filter">
    <option value="">Alle Zähler</option>
    <option value="strom-rathaus">Rathaus Strom</option>
    <option value="wasser-rathaus">Rathaus Wasser</option>
    <option value="gas-rathaus">Rathaus Gas</option>
  </select>

  <div id="table_div"></div>

  <script>
    const sheetId = "1FQRGGgJsAroNv29bPdziKyd6MXmb3n-pKg0ICCh5hP4";
    const sheetName = "Tabellenblatt1";
    const queryUrl = "https://docs.google.com/spreadsheets/d/" + sheetId + "/gviz/tq?sheet=" + sheetName;

    const zaehlernamen = {
      'strom-rathaus': 'Rathaus Strom',
      'wasser-rathaus': 'Rathaus Wasser',
      'gas-rathaus': 'Rathaus Gas'
    };

    google.charts.load('current', { packages: ['table'] });
    google.charts.setOnLoadCallback(drawTable);

    document.getElementById('filter').addEventListener('change', drawTable);

    function formatGerman(value) {
      let number = parseFloat(value.toString().replace(",", "."));
      if (isNaN(number)) return "-";
      return new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(number);
    }

    function extractDateTime(raw) {
      if (!raw) return "-";
      const d = new Date(raw);
      if (!isNaN(d)) {
        return d.toLocaleString("de-DE").replace(",", "");
      }
      return raw.toString();
    }

    function drawTable() {
      fetch(queryUrl)
        .then(res => res.text())
        .then(rep => {
          const data = JSON.parse(rep.substr(47).slice(0, -2));
          const rows = data.table.rows.map(r => {
            const zeit = extractDateTime(r.c[0]?.v);
            const zaehler = r.c[1]?.v || "-";
            const rawStand = r.c[2]?.v;
            const stand = rawStand != null ? formatGerman(rawStand) : "-";
            return [zeit, zaehlernamen[zaehler] || zaehler, stand];
          });

          const filterValue = document.getElementById('filter').value;
          const filteredRows = filterValue
            ? rows.filter(r => r[1] === zaehlernamen[filterValue])
            : rows;

          const dataTable = new google.visualization.DataTable();
          dataTable.addColumn('string', 'Datum & Uhrzeit');
          dataTable.addColumn('string', 'Zähler');
          dataTable.addColumn('string', 'Zählerstand');
          dataTable.addRows(filteredRows);

          const table = new google.visualization.Table(document.getElementById('table_div'));
          table.draw(dataTable, { showRowNumber: true, width: '100%', height: 'auto' });
        });
    }
  </script>
</body>
</html>
